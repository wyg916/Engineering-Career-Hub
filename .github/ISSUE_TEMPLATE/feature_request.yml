name: Feature request
description: Suggest an improvement to the offline learning workflow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What learning or interview-preparation problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful behavior.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does this require network access or knowledge-base writes?
      options:
        - "No"
        - Network access
        - Knowledge-base writes
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no private knowledge-base content or credentials.
          required: true
